*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#cddaf0;font-family:'Figtree','Segoe UI',Roboto,Arial,sans-serif;color:#2b2b2b}
#stage{position:absolute;left:0;top:0;width:1494px;height:840px;transform-origin:0 0;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,#dbe6f8,#c4d3ee)}
#stage>*,#dyn>*{position:absolute}
.bx>*{position:absolute}
svg{display:block;overflow:visible}
svg text{font-family:'Figtree','Segoe UI',Arial,sans-serif}
a{text-decoration:none;color:inherit}
.rw{cursor:pointer}
.lang{width:36px;height:30px;line-height:28px;text-align:center;border-radius:15px;color:#555;font-size:12px;font-weight:700;cursor:pointer}
.lang.on{background:#333;color:#fff}
.sp{display:flex;align-items:center;justify-content:center;height:26px;border-radius:13px;font-size:11.5px;font-weight:700;border:1px solid #dfe4ee;background:#f3f6fb;color:#333;white-space:nowrap}
.sp:hover{background:#8db8f2;border-color:#8db8f2}
.ib{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:#eef2f9;cursor:pointer;color:#333}
.ib:hover{background:#8db8f2}
.si{display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:14px;color:#9a9a9a;cursor:pointer}
.si:hover{color:#fff;background:#4a4a4a}
#tip{position:fixed;z-index:90;pointer-events:none;display:none;background:#333;color:#fff;font:600 12px 'Figtree','Segoe UI',Arial;padding:5px 10px;white-space:nowrap;border-radius:8px}
#tbl{position:fixed;inset:0;z-index:80;background:rgba(30,40,60,.55);display:none;align-items:center;justify-content:center}
#tbl.show{display:flex}
#sheet{width:min(960px,96vw);height:min(560px,90vh);background:#fff;border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
#sheet .tp{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#f1f5fc;border-bottom:1px solid #e0e7f3}
#sheet .tp b{flex:1;font-size:16px;color:#2b4a7a}
#sheet button{height:30px;padding:0 14px;border:1px solid #8db8f2;border-radius:15px;background:#fff;color:#2b4a7a;font-weight:700;cursor:pointer;font-family:inherit}
#sheet button:hover{background:#8db8f2}
#sheet .scr{flex:1;overflow:auto}
#sheet table{border-collapse:collapse;font-size:13px;width:100%}
#sheet th{position:sticky;top:0;background:#f1f5fc;color:#2b4a7a;padding:8px 10px;text-align:right;white-space:nowrap;border:1px solid #e3e9f4}
#sheet td{padding:6px 10px;border:1px solid #eef0f4;text-align:right;color:#222;white-space:nowrap}
#sheet th:first-child,#sheet td:first-child,#sheet th:nth-child(2),#sheet td:nth-child(2){text-align:left}
#sheet td[contenteditable]:focus{outline:2px solid #8db8f2;background:#f7fbff}
</style></head>
